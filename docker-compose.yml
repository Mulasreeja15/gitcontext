services:
  gitcontext:
    build: .
    command: python main.py serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-}
  qdrant:
    image: qdrant/qdrant:latest
    profiles: [qdrant]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
volumes:
  qdrant_storage:
